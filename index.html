<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GzCalendar | Infinite Timeline • BCE to ∞</title>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Anek Malayalam', 'Segoe UI', system-ui, sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
    }

    body {
      height: 100vh;
      background: #f8fafc;
      overflow: hidden;
    }

    body.dark {
      background: #0f172a;
      color: #e2e8f0;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(0px);
      padding: 1.5rem;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overflow-y: auto;
      z-index: 10;
    }

    body.dark .sidebar {
      background: #1e293b;
      border-right-color: #334155;
    }

    .sidebar h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #ec489a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    button, .sidebar button {
      padding: 0.6rem 1rem;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: #f1f5f9;
      transition: 0.2s;
      font-family: 'Anek Malayalam', sans-serif;
    }

    body.dark button {
      background: #334155;
      color: #f1f5f9;
    }

    #newEventBtn {
      background: #4f46e5;
      color: white;
      box-shadow: 0 4px 8px rgba(79,70,229,0.2);
    }

    .clockBox {
      background: #eef2ff;
      padding: 1rem;
      border-radius: 24px;
      text-align: center;
    }

    body.dark .clockBox {
      background: #0f172a;
      border: 1px solid #334155;
    }

    #liveClock {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .searchBox input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid #cbd5e1;
      background: white;
      font-family: 'Anek Malayalam', sans-serif;
      font-weight: 400;
    }

    body.dark .searchBox input,
    body.dark select,
    body.dark textarea {
      background: #0f172a;
      border-color: #475569;
      color: white;
    }

    .year-range {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .year-range button {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .importExport {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .importExport button {
      flex: 1;
      font-size: 0.8rem;
    }

    /* Main Calendar */
    .calendarContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .calendarHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      flex-wrap: wrap;
    }

    body.dark .calendarHeader {
      background: #1e293b;
      border-bottom-color: #334155;
    }

    .leftHeader, .rightHeader {
      display: flex;
      gap: 8px;
    }

    .viewBtn {
      background: #f1f5f9;
      padding: 6px 14px;
      font-weight: 600;
    }

    .viewBtn.active {
      background: #4f46e5;
      color: white;
    }

    .weekDays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: white;
      font-weight: 700;
      padding: 0.75rem 0;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }

    body.dark .weekDays {
      background: #1e293b;
    }

    #calendarGrid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: minmax(110px, auto);
      overflow-y: auto;
      background: #f1f5f9;
    }

    .dayCell {
      background: white;
      border: 1px solid #e9eef3;
      padding: 8px;
      overflow-y: auto;
      cursor: pointer;
      transition: 0.1s;
      position: relative;
    }

    body.dark .dayCell {
      background: #1e293b;
      border-color: #334155;
    }

    .dayCell:hover {
      background: #fef9e3;
    }

    .dayNumber {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .today-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #4f46e5;
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      border-radius: 20px;
      padding: 2px 8px;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(79,70,229,0.3);
    }

    .today-icon::before {
      content: "📍";
      font-size: 0.7rem;
    }

    body.dark .today-icon {
      background: #7c3aed;
    }

    .dayCell.today-highlight {
      background: linear-gradient(145deg, #fef9c3, #fef3c7);
      border: 2px solid #eab308;
    }

    body.dark .dayCell.today-highlight {
      background: linear-gradient(145deg, #1e3a8a, #1e40af);
      border: 2px solid #f59e0b;
    }

    .eventChip {
      padding: 4px 6px;
      margin-top: 4px;
      font-size: 11px;
      border-radius: 16px;
      color: white;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: grab;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .hidden {
      display: none;
    }

    .modalContent {
      width: 480px;
      max-width: 90vw;
      background: white;
      padding: 1.8rem;
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 25px 40px rgba(0,0,0,0.25);
    }

    body.dark .modalContent {
      background: #1e293b;
    }

    .modalActions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .modalActions button {
      flex: 1;
      font-weight: 600;
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 280px;
      }
    }
    @media (max-width: 680px) {
      .sidebar {
        display: none;
      }
    }

    input, select, textarea, button, .eventChip, .dayNumber, .weekDays div {
      font-family: 'Anek Malayalam', sans-serif;
    }
    
    h1, h2, h3, .modalContent h2 {
      font-family: 'Anek Malayalam', sans-serif;
      font-weight: 700;
    }
    
    .year-selector-wrapper {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .year-nav-btn {
      background: #e2e8f0;
      padding: 6px 10px;
      font-size: 1rem;
    }
    body.dark .year-nav-btn {
      background: #475569;
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h1>✨ GzCalendar</h1>
    <button id="newEventBtn">+ New Event</button>
    <div class="clockBox">
      <div id="liveClock"></div>
      <div id="liveDate"></div>
    </div>
    <div class="searchBox">
      <input type="text" id="searchInput" placeholder="🔍 Search events...">
    </div>
    <select id="categoryFilter">
      <option value="all">📂 All Categories</option>
      <option value="work">💼 Work</option>
      <option value="personal">🧘 Personal</option>
      <option value="school">📚 School</option>
      <option value="other">✨ Other</option>
    </select>
    
    <!-- Infinite Year Selector: BCE to Infinity -->
    <div class="year-selector-wrapper">
      <button id="yearMinusBtn" class="year-nav-btn" title="Jump -100 years">⏪ -100</button>
      <select id="yearSelector" style="flex:1;"></select>
      <button id="yearPlusBtn" class="year-nav-btn" title="Jump +100 years">+100 ⏩</button>
    </div>
    <div style="display: flex; gap: 6px; margin-top: 4px;">
      <button id="decadeMinusBtn" class="year-nav-btn">-10 yrs</button>
      <button id="decadePlusBtn" class="year-nav-btn">+10 yrs</button>
    </div>
    
    <div class="themeSection">
      <button id="themeBtn">🌙 Dark Mode</button>
    </div>
    <div class="importExport">
      <button id="exportBtn">📤 Export</button>
      <input type="file" id="importFile" hidden accept=".json">
      <button id="importBtn">📥 Import</button>
    </div>
    <div style="font-size: 11px; text-align: center; opacity:0.7;">🗓️ BCE • CE • ∞ Timeline</div>
  </aside>

  <main class="calendarContainer">
    <header class="calendarHeader">
      <div class="leftHeader">
        <button id="prevBtn">◀</button>
        <button id="todayBtn">Today</button>
        <button id="nextBtn">▶</button>
      </div>
      <h2 id="monthYear"></h2>
      <div class="rightHeader">
        <button class="viewBtn active" data-view="month">Month</button>
        <button class="viewBtn" data-view="week">Week</button>
        <button class="viewBtn" data-view="day">Day</button>
        <button class="viewBtn" data-view="agenda">Agenda</button>
      </div>
    </header>
    <div class="weekDays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="calendarGrid"></div>
  </main>
</div>

<!-- Event Modal -->
<div class="modal hidden" id="eventModal">
  <div class="modalContent">
    <h2 id="modalTitle">✏️ Event</h2>
    <input type="text" id="eventTitle" placeholder="Title *">
    <textarea id="eventDescription" placeholder="Description"></textarea>
    <input type="date" id="eventDate">
    <input type="time" id="eventTime">
    <select id="eventCategory">
      <option value="work">Work</option><option value="personal">Personal</option><option value="school">School</option><option value="other">Other</option>
    </select>
    <select id="recurringSelect">
      <option value="none">No repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option>
    </select>
    <input type="color" id="eventColor" value="#4f46e5">
    <div class="modalActions">
      <button id="saveEventBtn">💾 Save</button>
      <button id="cancelBtn">Cancel</button>
      <button id="deleteEventBtn" style="background:#dc2626; color:white;">🗑 Delete</button>
    </div>
  </div>
</div>

<script>
  // ---------- GzCalendar: Infinite Timeline (BCE to Infinity) ----------
  let currentDate = new Date(); // real today reference
  let events = JSON.parse(localStorage.getItem("calendarEvents")) || [];
  let currentView = "month";
  let editingIndex = null;
  
  // Helper: Format year display with BCE/CE notation
  function formatYearWithEra(year) {
    if (year < 0) return `${Math.abs(year)} BCE`;
    if (year === 0) return `1 BCE`; // historical convention: year 0 doesn't exist, but we'll map year 0 to 1 BCE for clarity
    return `${year} CE`;
  }
  
  // Convert JS Date (year, month, day) to a sortable key
  function getDateKey(year, month, day) {
    // year can be negative (BCE)
    return `${year}-${month+1}-${day}`;
  }
  
  // Normalize from input date string (YYYY-MM-DD) to internal format handling negative years
  function normalizeDate(dateVal) {
    if (!dateVal) return null;
    let d = new Date(dateVal);
    if (isNaN(d.getTime())) return null;
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }
  
  function convertDate(str) {
    let parts = str.split("-");
    if (parts.length === 3) {
      let y = parseInt(parts[0]);
      let m = String(parseInt(parts[1])).padStart(2,'0');
      let d = String(parseInt(parts[2])).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    return str;
  }
  
  function saveEvents() { localStorage.setItem("calendarEvents", JSON.stringify(events)); renderCurrentView(); }
  
  // Get today's key using currentDate (real today)
  function getTodayKey() {
    const today = new Date();
    return `${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
  }
  
  // expand recurring events (supports BCE/CE via string dates)
  function expandRecurringEvents(baseEvents) {
    let expanded = [];
    const maxFuture = new Date();
    maxFuture.setFullYear(maxFuture.getFullYear() + 5);
    baseEvents.forEach(ev => {
      expanded.push({ ...ev });
      if (ev.recurring && ev.recurring !== "none") {
        let dateParts = ev.date.split('-');
        let year = parseInt(dateParts[0]);
        let month = parseInt(dateParts[1]) - 1;
        let day = parseInt(dateParts[2]);
        let startDate = new Date(year, month, day);
        if (isNaN(startDate.getTime())) return;
        let endDate = new Date(maxFuture);
        let current = new Date(startDate);
        if (ev.recurring === "daily") current.setDate(current.getDate() + 1);
        else if (ev.recurring === "weekly") current.setDate(current.getDate() + 7);
        else if (ev.recurring === "monthly") current.setMonth(current.getMonth() + 1);
        while (current <= endDate) {
          let newDate = `${current.getFullYear()}-${current.getMonth()+1}-${current.getDate()}`;
          expanded.push({ ...ev, id: ev.id + "_" + newDate, date: newDate, recurringParent: ev.id });
          if (ev.recurring === "daily") current.setDate(current.getDate() + 1);
          else if (ev.recurring === "weekly") current.setDate(current.getDate() + 7);
          else if (ev.recurring === "monthly") current.setMonth(current.getMonth() + 1);
        }
      }
    });
    return expanded;
  }
  
  function getFilteredEvents() {
    let expanded = expandRecurringEvents(events);
    const search = searchInput.value.toLowerCase();
    const category = categoryFilter.value;
    return expanded.filter(ev => {
      if (search && !ev.title.toLowerCase().includes(search)) return false;
      if (category !== "all" && ev.category !== category) return false;
      return true;
    });
  }
  
  function renderCurrentView() {
    if (currentView === "month") renderMonthView();
    else if (currentView === "week") renderWeekView();
    else if (currentView === "day") renderDayView();
    else if (currentView === "agenda") renderAgendaView();
  }
  
  // Build month view with BCE support: manually construct calendar grid using absolute year/month
  function renderMonthView() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    // Get first day of month (0=Sun)
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    
    let monthName = currentDate.toLocaleString("default", { month: "long" });
    let yearLabel = formatYearWithEra(year);
    monthYear.textContent = `${monthName} ${yearLabel}`;
    
    calendarGrid.innerHTML = "";
    calendarGrid.style.gridTemplateColumns = "repeat(7, 1fr)";
    
    for (let i = 0; i < firstDay; i++) {
      let blank = document.createElement("div"); blank.className = "dayCell"; 
      calendarGrid.appendChild(blank);
    }
    
    const filtered = getFilteredEvents();
    const todayKey = getTodayKey();
    
    for (let day = 1; day <= lastDate; day++) {
      const cell = document.createElement("div");
      cell.className = "dayCell";
      const dateKey = `${year}-${month+1}-${day}`;
      cell.dataset.date = dateKey;
      
      if (dateKey === todayKey) cell.classList.add("today-highlight");
      
      const dayNum = document.createElement("div");
      dayNum.className = "dayNumber";
      dayNum.textContent = day;
      
      if (dateKey === todayKey) {
        const iconSpan = document.createElement("span");
        iconSpan.className = "today-icon";
        iconSpan.textContent = "Today";
        dayNum.appendChild(iconSpan);
      }
      cell.appendChild(dayNum);
      
      const dayEvents = filtered.filter(ev => ev.date === dateKey);
      dayEvents.forEach(ev => {
        const chip = document.createElement("div");
        chip.className = "eventChip";
        chip.style.background = ev.color;
        chip.textContent = ev.title + (ev.recurring && ev.recurring !== "none" ? " 🔁" : "");
        chip.draggable = true;
        chip.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", ev.title + "||" + ev.date); });
        cell.appendChild(chip);
      });
      
      // Holidays only for positive years (cosmetic)
      if (year > 0) {
        const holidays = { "1-1":"🎆 New Year", "12-25":"🎄 Christmas", "7-4":"🇺🇸 Independence", "10-31":"🎃 Halloween", "1-26":"🇮🇳 Republic Day", "8-15":"🇮🇳 Independence Day" };
        const key = `${month+1}-${day}`;
        if (holidays[key]) {
          let hdiv = document.createElement("div"); hdiv.className = "eventChip"; hdiv.style.background = "#b91c1c"; hdiv.textContent = holidays[key]; cell.appendChild(hdiv);
        }
      }
      calendarGrid.appendChild(cell);
    }
  }
  
  function renderWeekView() {
    const startOfWeek = new Date(currentDate);
    startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());
    let yearLabel = formatYearWithEra(currentDate.getFullYear());
    monthYear.textContent = `Week of ${startOfWeek.toDateString()} (${yearLabel})`;
    calendarGrid.innerHTML = "";
    calendarGrid.style.gridTemplateColumns = "repeat(7, 1fr)";
    const filtered = getFilteredEvents();
    const todayKey = getTodayKey();
    
    for (let i = 0; i < 7; i++) {
      let day = new Date(startOfWeek); day.setDate(startOfWeek.getDate() + i);
      let dateStr = `${day.getFullYear()}-${day.getMonth()+1}-${day.getDate()}`;
      let cell = document.createElement("div"); cell.className = "dayCell"; cell.dataset.date = dateStr;
      if (dateStr === todayKey) cell.classList.add("today-highlight");
      let header = document.createElement("div"); header.className = "dayNumber"; 
      header.textContent = day.toLocaleDateString("en-US", { weekday: 'short', month: 'numeric', day: 'numeric' });
      if (dateStr === todayKey) {
        let iconSpan = document.createElement("span"); iconSpan.className = "today-icon"; iconSpan.textContent = "Today";
        header.appendChild(iconSpan);
      }
      cell.appendChild(header);
      let dayEvents = filtered.filter(ev => ev.date === dateStr);
      dayEvents.forEach(ev => { let chip = document.createElement("div"); chip.className = "eventChip"; chip.style.background = ev.color; chip.textContent = ev.title; cell.appendChild(chip); });
      calendarGrid.appendChild(cell);
    }
  }
  
  function renderDayView() {
    let dateStr = `${currentDate.getFullYear()}-${currentDate.getMonth()+1}-${currentDate.getDate()}`;
    let yearLabel = formatYearWithEra(currentDate.getFullYear());
    monthYear.textContent = `${currentDate.toDateString()} (${yearLabel})`;
    calendarGrid.innerHTML = "";
    calendarGrid.style.gridTemplateColumns = "1fr";
    let cell = document.createElement("div"); cell.className = "dayCell"; cell.style.minHeight = "500px";
    if (dateStr === getTodayKey()) cell.classList.add("today-highlight");
    let titleDiv = document.createElement("h3"); 
    titleDiv.textContent = `📅 ${currentDate.toDateString()}`;
    if (dateStr === getTodayKey()) {
      let todayBadge = document.createElement("span"); todayBadge.className = "today-icon"; todayBadge.textContent = " Today";
      titleDiv.appendChild(todayBadge);
    }
    cell.appendChild(titleDiv);
    const filtered = getFilteredEvents().filter(ev => ev.date === dateStr);
    filtered.forEach(ev => { let chip = document.createElement("div"); chip.className = "eventChip"; chip.style.background = ev.color; chip.textContent = `${ev.time || "all day"} • ${ev.title}`; cell.appendChild(chip); });
    calendarGrid.appendChild(cell);
  }
  
  function renderAgendaView() {
    const filtered = getFilteredEvents();
    const sorted = [...filtered].sort((a,b) => {
      let [y1,m1,d1] = a.date.split('-').map(Number);
      let [y2,m2,d2] = b.date.split('-').map(Number);
      if (y1 !== y2) return y1 - y2;
      if (m1 !== m2) return m1 - m2;
      return d1 - d2;
    });
    monthYear.textContent = "📋 Infinite Agenda (BCE → ∞)";
    calendarGrid.innerHTML = "";
    calendarGrid.style.gridTemplateColumns = "1fr";
    let container = document.createElement("div"); container.style.padding = "1rem";
    if (sorted.length === 0) container.innerHTML = "<p>✨ No events across timeline.</p>";
    const todayKey = getTodayKey();
    sorted.forEach(ev => {
      let card = document.createElement("div"); card.style.background = "#f1f5f9"; card.style.margin = "8px 0"; card.style.padding = "12px"; card.style.borderRadius = "20px";
      if (document.body.classList.contains("dark")) card.style.background = "#334155";
      let yearNum = parseInt(ev.date.split('-')[0]);
      let eraLabel = yearNum < 0 ? `${Math.abs(yearNum)} BCE` : yearNum === 0 ? `1 BCE` : `${yearNum} CE`;
      let todayMark = ev.date === todayKey ? ' <span class="today-icon" style="display:inline-block; font-size:10px;">📍 Today</span>' : '';
      card.innerHTML = `<strong style="color:${ev.color}">${ev.title}</strong>${todayMark}<br/>📅 ${ev.date} (${eraLabel}) ${ev.time ? `⏰ ${ev.time}` : ""}<br/>📌 ${ev.category} ${ev.recurring && ev.recurring !== "none" ? `🔄 ${ev.recurring}` : ""}`;
      container.appendChild(card);
    });
    calendarGrid.appendChild(container);
  }
  
  // Infinite Year Selector: BCE to Infinity (dynamic generation)
  function populateYearSelector(selectedYear) {
    yearSelector.innerHTML = "";
    // Show from 5000 BCE to 5000 CE for practical UI, but user can type beyond via +/- jumps
    let startYear = -5000;
    let endYear = 5000;
    for (let y = startYear; y <= endYear; y++) {
      let option = document.createElement("option");
      option.value = y;
      let displayYear = y < 0 ? `${Math.abs(y)} BCE` : y === 0 ? `1 BCE` : `${y} CE`;
      option.textContent = displayYear;
      if (y === selectedYear) option.selected = true;
      yearSelector.appendChild(option);
    }
    // If selectedYear beyond range, add a temporary option
    if (selectedYear < startYear || selectedYear > endYear) {
      let extra = document.createElement("option");
      extra.value = selectedYear;
      let displayExtra = selectedYear < 0 ? `${Math.abs(selectedYear)} BCE` : `${selectedYear} CE`;
      extra.textContent = displayExtra + " (custom)";
      extra.selected = true;
      yearSelector.appendChild(extra);
    }
  }
  
  function setCurrentYear(yearVal) {
    let newDate = new Date(currentDate);
    newDate.setFullYear(yearVal);
    currentDate = newDate;
    populateYearSelector(yearVal);
    renderCurrentView();
  }
  
  // Modal & event handlers
  function openModal(editEvent = null, dateForNew = null) {
    if (editEvent) {
      eventTitle.value = editEvent.title;
      eventDescription.value = editEvent.description || "";
      eventDate.value = convertDate(editEvent.date);
      eventTime.value = editEvent.time || "";
      eventCategory.value = editEvent.category || "other";
      eventColor.value = editEvent.color;
      recurringSelect.value = editEvent.recurring || "none";
      editingIndex = events.findIndex(e => e.id === editEvent.id && !e.recurringParent);
      document.getElementById("modalTitle").innerText = "✏️ Edit Event";
    } else {
      eventTitle.value = "";
      eventDescription.value = "";
      if (dateForNew) eventDate.value = dateForNew;
      else eventDate.value = "";
      eventTime.value = "";
      eventCategory.value = "other";
      eventColor.value = "#4f46e5";
      recurringSelect.value = "none";
      editingIndex = null;
      document.getElementById("modalTitle").innerText = "➕ Create Event";
    }
    modal.classList.remove("hidden");
  }
  
  function saveEventFromModal() {
    if (!eventTitle.value.trim()) { alert("Title required"); return; }
    const newEvent = {
      id: editingIndex !== null ? events[editingIndex].id : Date.now() + "_" + Math.random(),
      title: eventTitle.value,
      description: eventDescription.value,
      date: normalizeDate(eventDate.value),
      time: eventTime.value,
      category: eventCategory.value,
      color: eventColor.value,
      recurring: recurringSelect.value,
    };
    if (editingIndex !== null) {
      events[editingIndex] = { ...events[editingIndex], ...newEvent };
    } else {
      events.push(newEvent);
    }
    saveEvents();
    modal.classList.add("hidden");
  }
  
  function deleteCurrentEvent() {
    if (editingIndex !== null && confirm("Delete this event?")) {
      events.splice(editingIndex, 1);
      saveEvents();
      modal.classList.add("hidden");
    }
  }
  
  // DOM elements
  const calendarGridEl = document.getElementById("calendarGrid");
  const monthYearEl = document.getElementById("monthYear");
  const modalEl = document.getElementById("eventModal");
  const searchInput = document.getElementById("searchInput");
  const categoryFilter = document.getElementById("categoryFilter");
  const yearSelector = document.getElementById("yearSelector");
  
  // Navigation & infinite year
  document.getElementById("prevBtn").onclick = () => { 
    if(currentView==="month") currentDate.setMonth(currentDate.getMonth()-1); 
    else if(currentView==="week") currentDate.setDate(currentDate.getDate()-7); 
    else currentDate.setDate(currentDate.getDate()-1);
    populateYearSelector(currentDate.getFullYear());
    renderCurrentView(); 
  };
  document.getElementById("nextBtn").onclick = () => { 
    if(currentView==="month") currentDate.setMonth(currentDate.getMonth()+1); 
    else if(currentView==="week") currentDate.setDate(currentDate.getDate()+7); 
    else currentDate.setDate(currentDate.getDate()+1);
    populateYearSelector(currentDate.getFullYear());
    renderCurrentView(); 
  };
  document.getElementById("todayBtn").onclick = () => { currentDate = new Date(); populateYearSelector(currentDate.getFullYear()); renderCurrentView(); };
  
  document.getElementById("yearMinusBtn").onclick = () => setCurrentYear(currentDate.getFullYear() - 100);
  document.getElementById("yearPlusBtn").onclick = () => setCurrentYear(currentDate.getFullYear() + 100);
  document.getElementById("decadeMinusBtn").onclick = () => setCurrentYear(currentDate.getFullYear() - 10);
  document.getElementById("decadePlusBtn").onclick = () => setCurrentYear(currentDate.getFullYear() + 10);
  
  yearSelector.onchange = () => { setCurrentYear(parseInt(yearSelector.value)); };
  
  document.querySelectorAll(".viewBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".viewBtn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentView = btn.dataset.view;
      renderCurrentView();
    });
  });
  
  document.addEventListener("click", (e) => {
    const dayCell = e.target.closest(".dayCell");
    if (dayCell && dayCell.dataset.date && !e.target.closest(".eventChip")) {
      openModal(null, dayCell.dataset.date);
    }
    if (e.target.classList.contains("eventChip")) {
      const titleFull = e.target.textContent.replace(" 🔁", "");
      const found = events.find(ev => ev.title === titleFull);
      if (found) openModal(found);
      e.stopPropagation();
    }
  });
  
  document.addEventListener("dragover", (e) => { if (e.target.closest(".dayCell")) e.preventDefault(); });
  document.addEventListener("drop", (e) => {
    const targetCell = e.target.closest(".dayCell");
    if (!targetCell || !targetCell.dataset.date) return;
    const dragData = e.dataTransfer.getData("text/plain");
    if (!dragData) return;
    const [evTitle] = dragData.split("||");
    const eventObj = events.find(ev => ev.title === evTitle);
    if (eventObj) { eventObj.date = targetCell.dataset.date; saveEvents(); }
  });
  
  document.getElementById("exportBtn").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(events, null,2)], {type:"application/json"})); a.download = "gcalendar_backup.json"; a.click(); };
  document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = (e) => { const file = e.target.files[0]; if(file) { const reader = new FileReader(); reader.onload = (ev) => { try { events = JSON.parse(ev.target.result); saveEvents(); alert("Imported!"); } catch(e) { alert("Invalid file"); } }; reader.readAsText(file); } };
  
  const themeBtn = document.getElementById("themeBtn");
  if(localStorage.getItem("theme") === "dark") document.body.classList.add("dark");
  themeBtn.onclick = () => { document.body.classList.toggle("dark"); localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light"); themeBtn.innerHTML = document.body.classList.contains("dark") ? "☀️ Light Mode" : "🌙 Dark Mode"; };
  themeBtn.innerHTML = document.body.classList.contains("dark") ? "☀️ Light Mode" : "🌙 Dark Mode";
  
  function updateClock() { let now = new Date(); document.getElementById("liveClock").innerText = now.toLocaleTimeString(); document.getElementById("liveDate").innerText = now.toDateString(); }
  updateClock(); setInterval(updateClock, 1000);
  
  if ("Notification" in window) Notification.requestPermission();
  setInterval(() => {
    const now = new Date();
    const expanded = expandRecurringEvents(events);
    expanded.forEach(ev => {
      if (ev.time) {
        let eventDateTime = new Date(`${ev.date}T${ev.time}`);
        let diff = eventDateTime - now;
        if (diff > 0 && diff < 60000 && Notification.permission === "granted") new Notification("🔔 Reminder", { body: ev.title });
      }
    });
  }, 30000);
  
  document.getElementById("saveEventBtn").onclick = saveEventFromModal;
  document.getElementById("cancelBtn").onclick = () => modalEl.classList.add("hidden");
  document.getElementById("deleteEventBtn").onclick = deleteCurrentEvent;
  searchInput.oninput = () => renderCurrentView();
  categoryFilter.onchange = () => renderCurrentView();
  window.onclick = (e) => { if (e.target === modalEl) modalEl.classList.add("hidden"); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") modalEl.classList.add("hidden"); });
  
  populateYearSelector(currentDate.getFullYear());
  renderCurrentView();
</script>
</body>
</html>
